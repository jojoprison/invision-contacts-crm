version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: senior_crm
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with existing project
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
